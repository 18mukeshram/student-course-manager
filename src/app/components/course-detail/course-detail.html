<div *ngIf="course as c" class="space-y-6">
  <!-- Back link -->
  <button
    routerLink="/courses"
    class="inline-flex items-center text-xs text-slate-300 hover:text-sky-300 transition"
  >
    ← Back to courses
  </button>

  <!-- Course summary card -->
  <div class="grid gap-6 md:grid-cols-[2fr,1fr]">
    <div
      class="rounded-2xl bg-slate-900/70 border border-slate-800 shadow-lg shadow-slate-950/40 p-5"
    >
      <h1 class="text-2xl font-semibold mb-1.5">
        {{ c.name }}
      </h1>
      <p class="text-sm text-slate-400 mb-4">
        {{ c.code }}
      </p>

      <div class="grid gap-3 sm:grid-cols-2">
        <div class="space-y-1">
          <p class="text-xs text-slate-400">Instructor</p>
          <p class="text-sm font-medium text-slate-100">
            {{ c.instructor }}
          </p>
        </div>
        <div class="space-y-1">
          <p class="text-xs text-slate-400">Credits</p>
          <p class="text-sm font-medium text-slate-100">
            {{ c.credits }}
          </p>
        </div>
      </div>
    </div>

    <div
      class="rounded-2xl bg-slate-900/70 border border-slate-800 shadow-lg shadow-slate-950/40 p-4 space-y-2 text-sm"
    >
      <p class="flex items-center justify-between">
        <span class="text-slate-400">Total students</span>
        <span class="font-semibold text-slate-100">
          {{ c.students.length }}
        </span>
      </p>
      <p class="flex items-center justify-between text-xs text-slate-400">
        <span>Course code</span>
        <span class="font-mono text-slate-200">
          {{ c.code }}
        </span>
      </p>
    </div>
  </div>

  <!-- Students list -->
  <section
    class="rounded-2xl bg-slate-900/70 border border-slate-800 shadow-lg shadow-slate-950/40 p-5 space-y-4"
  >
    <h2 class="text-lg font-semibold">Enrolled Students ({{ c.students.length }})</h2>

    <ng-container *ngIf="c.students.length > 0; else noStudents">
      <ul class="space-y-3">
        <li
          *ngFor="let student of c.students"
          class="flex items-center justify-between rounded-xl bg-slate-800/70 px-4 py-3"
        >
          <div>
            <p class="text-sm font-medium text-slate-50">
              {{ student.name }}
            </p>
            <p class="text-xs text-slate-400">
              {{ student.email }}
            </p>
          </div>

          <button
            class="text-xs px-3 py-1.5 rounded-full bg-red-500/80 hover:bg-red-500 text-white transition"
            (click)="removeStudent(student.id)"
          >
            Remove
          </button>
        </li>
      </ul>
    </ng-container>

    <ng-template #noStudents>
      <p class="text-sm text-gray-500">No students enrolled yet.</p>
    </ng-template>
  </section>

  <!-- Add new student -->
  <section
    class="rounded-2xl bg-slate-900/70 border border-slate-800 shadow-lg shadow-slate-950/40 p-5 space-y-4"
  >
    <h2 class="text-lg font-semibold">Add New Student</h2>

    <form class="grid gap-3 md:grid-cols-[2fr,2fr,auto]" (ngSubmit)="addStudent()">
      <input
        type="text"
        class="rounded-xl bg-slate-950/60 border border-slate-700 px-3 py-2 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent"
        placeholder="Student name"
        [(ngModel)]="studentName"
        name="studentName"
      />

      <input
        type="email"
        class="rounded-xl bg-slate-950/60 border border-slate-700 px-3 py-2 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent"
        placeholder="Student email"
        [(ngModel)]="studentEmail"
        name="studentEmail"
      />

      <button
        type="submit"
        class="rounded-xl bg-sky-600 hover:bg-sky-500 text-sm font-medium px-4 py-2 text-white transition"
      >
        Add Student
      </button>
    </form>
  </section>
</div>
